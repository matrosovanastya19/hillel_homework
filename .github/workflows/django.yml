name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        cd bookstore
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Flake8 and Black
      run: |
        cd bookstore
        black --check .
        flake8 . --max-line-length=88

    - name: Run Tests with Pytest and Coverage
      env:
        DJANGO_SETTINGS_MODULE: bookstore.settings.development
      run: |
        pytest --cov=. --cov-report=xml

  build-and-push-docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/bookstore:latest

  warehouse-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: warehouse_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Warehouse dependencies
        run: pip install -r warehouse/requirements.txt

      - name: Run Warehouse pytest
        working-directory: warehouse
        env:
          DJANGO_SETTINGS_MODULE: warehouse_config.settings
          SECRET_KEY: test-secret-key
          DEBUG: "True"
          DB_NAME: warehouse_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          WAREHOUSE_API_TOKEN: test-service-token
        run: pytest inventory/tests.py -v