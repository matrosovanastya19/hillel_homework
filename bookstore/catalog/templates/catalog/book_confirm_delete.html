{% extends 'catalog/base.html' %}
{% load i18n %}

{% block content %}
    <div class="alert alert-danger">
        <h2>{% trans "Ви впевнені?" %}</h2>
        <p>{% blocktrans with title=book.title %}Ви дійсно хочете видалити книгу "{{ title }}"?{% endblocktrans %}</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">{% trans "Так, видалити" %}</button>
            <a href="{% url 'catalog:book_detail' book.pk %}" class="btn btn-secondary">{% trans "Скасувати" %}</a>
        </form>
    </div>
{% endblock %}
