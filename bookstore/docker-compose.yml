version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bookstore_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  web:
    build: .
    # ЗАМІНА: Замість runserver використовуємо production-сервер Gunicorn
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn bookstore.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    environment:
      - POSTGRES_DB=bookstore_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis

  # NGINX (Reverse proxy + Static files)
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80" 
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web

  # CELERY WORKER
  celery:
    build: .
    command: celery -A bookstore worker -l info
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis

  # CELERY BEAT (Для періодичних задач)
  celery-beat:
    build: .
    command: celery -A bookstore beat -l info
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  static_volume: