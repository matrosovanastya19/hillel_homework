{% extends 'base.html' %}

{% block title %}Список книг - Класична Література{% endblock %}

{% block content %}
    <h2>Зміст: Каталог книг</h2>
    <ul>
        {% for book in books_list %}
            <li style="margin-bottom: 10px;">
                <strong>«{{ book.title }}»</strong> — <em>{{ book.author }}</em> ({{ book.year }} рік)
            </li>
        {% endfor %}
    </ul>
{% endblock %}
